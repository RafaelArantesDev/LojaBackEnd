spring.application.name=loja

server.port=${PORT:8080}
server.address=0.0.0.0

# ---------- Banco de dados (variaveis definidas no Render) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ---------- Login (Supabase) ----------
# false = API aberta (como nas aulas).  true = exige o token do Supabase enviado pelo React.
app.auth.ativa=${APP_AUTH_ATIVA:false}
app.supabase.url=${SUPABASE_URL:}
app.supabase.anon-key=${SUPABASE_ANON_KEY:}

# ---------- CORS: URL do site (front-end) publicado no Render ----------
app.cors.origins=${CORS_ORIGINS}
