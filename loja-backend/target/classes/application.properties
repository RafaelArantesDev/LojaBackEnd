spring.application.name=loja

# ---------- Banco de dados (desenvolvimento local) ----------
# Ajuste usuario/senha no seu computador ou use as variaveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestao?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=Titanks08.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Nao altera o banco: as tabelas ja existem (importadas do dump)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false


# ---------- Login (Supabase) ----------
# false = API aberta (como nas aulas).  true = exige o token do Supabase enviado pelo React.
app.auth.ativa=${APP_AUTH_ATIVA:false}
app.supabase.url=${SUPABASE_URL:}
app.supabase.anon-key=${SUPABASE_ANON_KEY:}

# ---------- CORS: enderecos do front-end autorizados (separados por virgula) ----------
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
